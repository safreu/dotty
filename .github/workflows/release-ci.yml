name: Release CI

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

concurrency:
  group: release-ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify-release:
    name: Verify release
    if: github.event.pull_request.head.ref == 'dev'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: release-check

      - name: Verify release version
        shell: bash
        run: |
          set -euo pipefail

          VERSION="$(
            cargo metadata --no-deps --format-version 1 \
              | jq -r '.packages[] | select(.name == "dotty") | .version'
          )"

          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid release version: $VERSION"
            exit 1
          fi

          echo "Release version: $VERSION"

          if git ls-remote --exit-code \
            "https://github.com/${GITHUB_REPOSITORY}.git" \
            "refs/tags/v${VERSION}" >/dev/null 2>&1
          then
            echo "Tag v${VERSION} already exists"
            exit 1
          fi

      - name: Verify release build
        run: cargo build --release --locked